name: Lab19 CI

on:
  push:
    branches:
      - lab19/full-score-ci-bonus
    paths:
      - '**.py'
      - 'data/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab19-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas
      - name: Run unit tests
        run: python -m pytest -q
